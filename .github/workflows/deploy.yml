name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 13.203.86.108
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/gokul-healthcare-platform
            git fetch origin main
            git reset --hard origin/main
            git clean -fd -e backend/venv -e backend/.env
            
            # Ensure venv exists and has all locked packages
            cd backend
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            ./venv/bin/pip install --upgrade pip
            ./venv/bin/pip install -r requirements.txt
            
            # Restart backend
            sudo systemctl restart fastapi
            
            # Build and deploy frontend
            cd ../frontend
            npm run build
            sudo rm -rf /var/www/health-app/*
            sudo cp -r dist/* /var/www/health-app/
            sudo systemctl reload nginx
